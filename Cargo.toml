[package]
name = "harbour-ratatui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Small, versioned C ABI between Harbour and Ratatui"

[lib]
crate-type = ["cdylib"]

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["all-widgets"] }
unicode-width = "=0.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
